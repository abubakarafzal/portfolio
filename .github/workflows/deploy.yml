name: Build and Deploy

# The build is now a plain CRA build — no GitHub API fetch, no tokens, no
# network calls at build time. `homepage` in package.json sets the /portfolio/
# base path so every asset URL resolves correctly on GitHub Pages.
env:
  CI: false

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js 🔧
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install 📦
        run: npm ci

      - name: Build 🔧
        run: npm run build

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages
          folder: build
